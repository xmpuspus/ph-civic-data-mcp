[project]
name = "ph-civic-data-mcp"
dynamic = ["version"]
description = "MCP server for Philippine civic data: the full PSA OpenSTAT statistical catalog, PSGC locations, infra spending accountability, PSA economy (inflation, labor, poverty, population), one-call area profiles, earthquakes, weather, typhoons, procurement, solar/climate, air quality, vegetation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xavier Puspus" }]
keywords = ["mcp", "philippines", "phivolcs", "pagasa", "philgeps", "psa", "openstat", "psgc", "nasa", "modis", "usgs", "ibtracs", "world-bank", "civic-tech", "open-data", "accountability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.9.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/xmpuspus/ph-civic-data-mcp"
Repository = "https://github.com/xmpuspus/ph-civic-data-mcp"
Issues = "https://github.com/xmpuspus/ph-civic-data-mcp/issues"

[project.scripts]
ph-civic-data-mcp = "ph_civic_data_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ph_civic_data_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_civic_data_mcp"]

# The default sdist carries every VCS-tracked file: .claude/, .github/,
# docs/archive/, every demo GIF and tape, tests/, uv.lock. None of that is
# needed to build or run the package, so list what ships instead of what to
# drop.
# Leading slashes anchor each pattern to the repo root. Without them a bare
# "README.md" matches at any depth, and a nested agent worktree under
# .claude/ shipped its own README and LICENSE copies into the sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/src/ph_civic_data_mcp",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "/.claude",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "live: hits real upstream endpoints; opt-in via -m live",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"docs/live_probe_v020.py" = ["E402"]
"docs/live_probe_v030.py" = ["E402"]
"docs/live_demo.py" = ["E402"]
"docs/live_demo_single.py" = ["E402"]
"docs/live_demo_v030.py" = ["E402"]
