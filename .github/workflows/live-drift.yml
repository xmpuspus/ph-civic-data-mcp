name: Live upstream drift check

# Scrapers rot silently: PHIVOLCS/PAGASA/PhilGEPS can change their HTML and
# every offline test stays green. PSA also moves whole subjects, which is how
# poverty discovery broke for five weeks in 2026. This weekly run exercises the
# live-marked suite against the real upstreams so drift shows up here first,
# not in a user report. Failures mean "go look at the upstream", not "block a
# PR" — the job is scheduled, never required.

on:
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      UV_PYTHON: "3.12"
    steps:
      # persist-credentials off: this job holds issues: write, and the live
      # tests run repository code, so the token must not sit in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Exact tag on purpose: setup-uv stopped publishing floating major tags
      # at v8, so @v9 is a 404 and every job fails at checkout.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python 3.12
        run: uv python install 3.12

      # --python is not optional here. Without it uv reads .python-version and
      # builds the environment on 3.11, so the job's own name lies about what
      # it exercised.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check the interpreter is the one the job names
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          print("sys.version:", sys.version)
          assert sys.version_info[:2] == (3, 12), sys.version
          PY

      - name: Run live suite against real upstreams
        run: uv run --no-sync pytest tests/ -q -m live

      # A failed run only shows in the Actions tab, so 8 of the last 12
      # weekly runs failed and nobody noticed. File or update one issue
      # instead, so drift surfaces where someone actually looks.
      - name: File or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-drift --force --color d73a4a \
            --description "Weekly live upstream check failed"

          today=$(date -u +%Y-%m-%d)
          existing=$(gh issue list --label live-drift --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --body "The run on ${today} failed too. See ${RUN_URL}."
          else
            gh issue create \
              --title "Live-drift run failed" \
              --label live-drift \
              --body "The weekly live-drift run failed on ${today}. See ${RUN_URL}. Read the run log to find which upstream source changed."
          fi
