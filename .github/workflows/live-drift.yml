name: Live upstream drift check

# Scrapers rot silently: PHIVOLCS/PAGASA/PhilGEPS can change their HTML and
# every offline test stays green. PSA also moves whole subjects, which is how
# poverty discovery broke for five weeks in 2026. This weekly run exercises the
# live-marked suite against the real upstreams so drift shows up here first,
# not in a user report. Failures mean "go look at the upstream", not "block a
# PR" — the job is scheduled, never required.

on:
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      # Exact tag on purpose: setup-uv stopped publishing floating major tags
      # at v8, so @v9 is a 404 and every job fails at checkout.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      # --python is not optional here. Without it uv reads .python-version and
      # builds the environment on 3.11, so the job's own name lies about what
      # it exercised.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check the interpreter is the one the job names
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          print("sys.version:", sys.version)
          assert sys.version_info[:2] == (3, 12), sys.version
          PY

      - name: Run live suite against real upstreams
        run: uv run --no-sync pytest tests/ -q -m live
