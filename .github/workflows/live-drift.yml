name: Live upstream drift check

# Scrapers rot silently: PHIVOLCS/PAGASA/PhilGEPS can change their HTML and
# every offline test stays green. This weekly run exercises the live-marked
# suite against the real upstreams so drift shows up here first, not in a
# user report. Failures mean "go look at the upstream", not "block a PR" —
# the job is scheduled, never required.

on:
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run live suite against real upstreams
        run: uv run pytest tests/ -q -m live
